name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: 18.x
      - name: bun
        run: bun install
        working-directory: ./
      - name: tsc
        run: npx tsc
        working-directory: ./
      - name: Lint
        run: bun run lint
        working-directory: ./
      - name: Test
        run: bun run test
        working-directory: ./
